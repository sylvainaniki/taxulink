name: Validate foundation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --experimental-strip-types scripts/init-env.ts
      - run: docker compose up --build --wait --wait-timeout 180
      - name: Container health and authenticated session
        run: |
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:3000 > /dev/null
          node --env-file=.env --input-type=module <<'JS'
          const health = await fetch('http://localhost:4000/api/v1/health');
          if (!health.ok || !(await health.json()).demo) throw new Error('Health check failed');
          const response = await fetch('http://localhost:3000/api/v1/auth/login', {
            method: 'POST', headers: {'Content-Type': 'application/json', Origin: 'http://localhost:3000'},
            body: JSON.stringify({email: 'admin@atlas.example', password: process.env.DEMO_PASSWORD})
          });
          if (!response.ok || !response.headers.get('set-cookie')) throw new Error('Container login failed: ' + response.status);
          console.log('Container health and proxied login passed.');
          JS
      - if: failure()
        run: docker compose logs --tail 60
      - if: always()
        run: docker compose down --volumes
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-synthetic-only
          POSTGRES_DB: taxilink_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d taxilink_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm test
        name: Integration tests on PostgreSQL 16
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-synthetic-only@localhost:5432/taxilink_test
      - run: npm run build:mobile
        env:
          CI: '1'
      - run: node --import tsx scripts/benchmark.ts
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - name: Browser end-to-end smoke test
        run: |
          printf '%s\n' 'DEMO_MODE=true' 'DEMO_PASSWORD=ci-synthetic-password-only' > .env
          node --env-file=.env --import tsx apps/api/src/seed.ts
          node --env-file=.env --import tsx apps/api/src/main.ts > /tmp/taxilink-api.log 2>&1 &
          npm run start -w @taxilink/web -- --hostname 127.0.0.1 > /tmp/taxilink-web.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:4000/api/v1/health && curl -fsS http://localhost:3000 > /dev/null; then break; fi
            sleep 1
          done
          npm run test:e2e
