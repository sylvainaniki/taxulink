services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: taxilink
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d taxilink']
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    command: ['sh', '-c', 'npm run db:seed && npm run dev']
    environment:
      DEMO_MODE: 'true'
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/taxilink
      WEB_ORIGIN: http://localhost:3000
      REAL_SENSITIVE_DOCUMENTS_ENABLED: 'false'
    ports: ['127.0.0.1:4000:4000']
    depends_on:
      db: {condition: service_healthy}
  web:
    build: .
    command: ['npm', 'run', 'start', '-w', '@taxilink/web']
    ports: ['127.0.0.1:3000:3000']
    depends_on: [api]
volumes:
  postgres_data:
